# Local-only development stack. No remote project is linked by these commands.
project_id = "rally-grounds-local"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 10000
auto_expose_new_tables = false
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[db.pooler]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
[auth.email]
# Enable email/password provider; global auth.enable_signup still forbids signup.
enable_signup = true
enable_confirmations = false
[auth.rate_limit]
sign_in_sign_ups = 100
[studio]
enabled = false
[local_smtp]
enabled = false
[storage]
enabled = false
[realtime]
enabled = false
[edge_runtime]
enabled = false
[analytics]
enabled = false
